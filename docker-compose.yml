services:

  postgres:

    image: postgres:17

    container_name: performance-coach-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: performance
      POSTGRES_PASSWORD: performance
      POSTGRES_DB: performance_coach

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data:
